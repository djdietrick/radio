server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + streaming to the Go backend. proxy_buffering off keeps Range
    # streaming responsive for audio seeking.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location /healthz {
        proxy_pass http://backend:8080;
    }
}
