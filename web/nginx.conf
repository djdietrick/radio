# Maps the Upgrade request header to the Connection value the backend needs,
# so WebSocket upgrades pass through while normal requests use keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + streaming to the Go backend. proxy_buffering off keeps Range
    # streaming responsive for audio seeking. The Upgrade/Connection headers let
    # the radio live-sync WebSocket (/api/stations/{id}/ws) upgrade through nginx.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /healthz {
        proxy_pass http://backend:8080;
    }
}
